name: CI — Test & Clippy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verifica Riproducibile (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Verify SQLite3 shared library availability
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 coreutils

      - name: Run Clippy (--workspace --all-targets -- -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Test Suite (--workspace -- --nocapture)
        run: cargo test --workspace -- --nocapture
