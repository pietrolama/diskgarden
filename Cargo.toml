[workspace]
resolver = "2"
members = [
    "crates/disk-garden-core",
    "crates/disk-garden-cli",
    "crates/disk-garden-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["DiskGarden Contributors"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libc = "0.2.186"
thiserror = "1.0.69"
tempfile = "3.27.0"

[profile.dev]
opt-level = 2
